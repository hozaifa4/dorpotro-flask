<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorpotro.bd Intel | Tender Intelligence Platform</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23031636'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="app-header">
    <a href="/" class="logo-wrapper">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div class="logo-text-group">
        <div class="logo-title-row">
          <span class="logo-brand">DORPOTRO.BD</span>
          <span class="intel-badge">INTEL</span>
        </div>
        <span class="logo-subtitle">TENDER INTELLIGENCE PLATFORM</span>
      </div>
    </a>

    <div class="header-actions">
      <button type="button" class="btn-sidebar-toggle" id="btnSidebarToggle">
        ◫ Hide Sidebar
      </button>
    </div>
  </header>

  <!-- Main App Shell -->
  <div class="app-container">
    
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="sidebar">
      <a href="#" class="sidebar-nav-item active">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span>🚀</span>
          <span>Live Tenders (eprocure)</span>
        </div>
        <span class="sidebar-count-badge" id="sidebarCountBadge">2077</span>
      </a>

      <a href="#" class="sidebar-nav-item" style="opacity: 0.7;">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span>📊</span>
          <span>Tender Analytics Hub</span>
        </div>
      </a>
    </aside>

    <!-- Main Workspace -->
    <main class="app-main">
      
      <!-- Filter Card -->
      <div class="filter-card">
        <!-- Search Input -->
        <div class="search-bar-row">
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search by ID, keyword, ref or ministry..." autocomplete="off">
          </div>
          <button type="button" id="clearFilterBtn" class="btn-clear-filter">Clear Filters</button>
        </div>

        <!-- Dropdowns -->
        <div class="dropdown-grid">
          <div>
            <select id="natureFilter" class="filter-select">
              <option value="All">Natures: All</option>
              <option value="Works">Works</option>
              <option value="Goods">Goods</option>
              <option value="Services">Services</option>
            </select>
          </div>
          <div>
            <select id="methodFilter" class="filter-select">
              <option value="All">Methods: All</option>
              <option value="OTM">OTM (Open Tendering)</option>
              <option value="LTM">LTM (Limited Tendering)</option>
              <option value="QCBS">QCBS (Quality & Cost Based)</option>
              <option value="RFQ">RFQ (Request for Quotation)</option>
              <option value="DPM">DPM (Direct Procurement)</option>
            </select>
          </div>
          <div>
            <select id="districtFilter" class="filter-select">
              <option value="All">Districts: All</option>
            </select>
          </div>
          <div>
            <select id="orgFilter" class="filter-select">
              <option value="All">Orgs: All</option>
            </select>
          </div>
          <div class="dropdown-full">
            <select id="peFilter" class="filter-select">
              <option value="All">PEs: All</option>
            </select>
          </div>
        </div>

        <!-- Tabs Row -->
        <div class="tab-pills-row">
          <button type="button" class="tab-pill" id="tabActive">
            <span style="color: #10b981;">•</span> Active (<span id="activeCountBadge">0</span>)
          </button>
          <button type="button" class="tab-pill" id="tabArchived">
            <span style="color: #64748b;">•</span> Archived (<span id="archivedCountBadge">0</span>)
          </button>
          <button type="button" class="tab-pill active" id="tabAll">
            ALL (<span id="allCountBadge">0</span>)
          </button>
        </div>
      </div>

      <!-- Tender Cards Grid -->
      <div class="tender-grid" id="tenderGrid">
        <!-- Live rendered via Vanilla JS in milliseconds -->
        <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 1rem; color: #64748b;">
          <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">⚡</div>
          <p style="font-weight: 600;">Loading live tender intelligence...</p>
        </div>
      </div>

      <!-- Pagination Bar -->
      <div class="pagination-bar" id="paginationBar" style="display: none;">
        <div class="pagination-info" id="paginationInfo">Showing 1 to 24 of tenders</div>
        <div class="pagination-controls" id="paginationControls"></div>
      </div>

    </main>
  </div>

  <!-- Interactive Detail Modal Drawer -->
  <div class="modal-overlay" id="tenderModal">
    <div class="modal-box" id="modalContent"></div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Vanilla JS Engine (Ultra fast & zero build) -->
  <script src="/static/js/app.js"></script>
</body>
</html>
