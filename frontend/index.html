    <script>
      (function() {
        try {
          var currentFetch = window.fetch || globalThis.fetch;
          if (currentFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(v) { currentFetch = v; },
              configurable: true,
              enumerable: true
            });
            Object.defineProperty(globalThis, 'fetch', {
              get: function() { return currentFetch; },
              set: function(v) { currentFetch = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Sandbox fetch setter override failed:', e);
        }
      })();
    </script>
